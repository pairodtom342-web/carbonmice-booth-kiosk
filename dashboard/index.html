<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>carbonMICE Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#065DED; --mint:#35E5C0; --navy:#1A1A2E; --deep-mint:#0FAE8E;
  --slate:#8A94A6; --bg:#F4F7FB; --line:#EAEEF5;
  --dock-gap:20px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#fff}
body{font-family:'Sarabun',system-ui,sans-serif;color:var(--navy)}
button{font:inherit;border:0;cursor:pointer;background:none;color:inherit}
[hidden]{display:none!important}

/* ---------- dashboard ---------- */
#dash{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}

/* ---------- ปุ่ม "ขยายหน้าจอ" ทับตำแหน่งเดิมของ dashboard (fixed top-4 กึ่งกลาง 142×40) ---------- */
#fsBtn{
  position:fixed;z-index:40;top:16px;left:50%;transform:translateX(-50%);
  min-width:142px;height:40px;padding:8px 16px;border-radius:999px;background:#E2F2FF;
  display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:'IBM Plex Sans Thai','Sarabun',sans-serif;font-size:16px;font-weight:600;color:#0065D0;line-height:24px;white-space:nowrap
}
#fsBtn:hover{background:#d6ebfc}
#fsBtn img{width:15px;height:15px;display:block}
body.is-fs #fsBtn img{transform:rotate(180deg)}

/* ---------- กรอบวิดีโอโฆษณา ---------- */
#backdrop{
  position:fixed;inset:0;z-index:50;background:rgba(8,10,20,.62);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .35s ease
}
body.expanded #backdrop{opacity:1;pointer-events:auto}

#dock{
  position:fixed;z-index:60;right:var(--dock-gap);bottom:var(--dock-gap);
  padding:3px;border-radius:22px;
  background:linear-gradient(135deg,var(--blue),var(--mint));
  box-shadow:0 18px 50px rgba(10,20,50,.38),0 2px 8px rgba(10,20,50,.2);
  opacity:0;transform:translateY(24px) scale(.96);pointer-events:none;
  transition:opacity .45s ease,transform .45s cubic-bezier(.2,.8,.2,1)
}
#dock.show{opacity:1;transform:none;pointer-events:auto}
.dock-in{border-radius:19px;overflow:hidden;background:#fff;display:flex;flex-direction:column}

.dock-head{
  display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;background:#fff
}
.dock-head img{height:22px;display:block}
.dock-head .tag{
  font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--deep-mint);
  background:#E8FFF9;border-radius:99px;padding:2px 8px;white-space:nowrap
}
.dock-head .sp{flex:1}
.ctl{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  font-size:16px;line-height:1;background:var(--bg);color:var(--navy);transition:background .15s
}
.ctl:hover{background:#E2F2FF}
.ctl svg{width:16px;height:16px;display:block}
#adClose{background:var(--navy);color:#fff}
#adClose:hover{background:#000}

.vbox{position:relative;background:#000;overflow:hidden}
.vbox video{display:block;width:100%;height:100%;object-fit:cover}
.vprog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
.vprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--mint))}

/* ขนาดตามทิศคลิป — กรอบพอดีคลิป ไม่มีพื้นดำ (ความกว้างกรอบ = ความกว้างวิดีโอ) */
.dock-in{width:var(--w)}
.vbox{width:100%}
#dock.land{--w:clamp(300px,30vw,500px)}
#dock.land .vbox{aspect-ratio:16/9}
#dock.port{--w:calc(clamp(360px,44vh,440px) * 9 / 16)}
#dock.port .vbox{aspect-ratio:9/16}
#dock.port .dock-head .tag{display:none}

/* ขยาย: กล่องกลางจอ ไม่เต็มจอ */
body.expanded #dock{right:50%;bottom:50%;transform:translate(50%,50%)}
body.expanded #dock.land{--w:min(78vw,calc((86vh - 50px) * 16 / 9))}
body.expanded #dock.port{--w:min(90vw,calc((86vh - 50px) * 9 / 16))}
body.expanded .dock-head img{height:28px}

@media (max-width:640px){
  #dock.land{--w:min(62vw,340px)}
  #dock.land .dock-head .tag{display:none}
  :root{--dock-gap:12px}
}

/* ---------- ปุ่มเปิด/ปิดวิดีโอ (โผล่เมื่อขยับเมาส์/แตะที่มุมซ้ายล่าง) ---------- */
/* dashboard (iframe) กินเหตุการณ์เมาส์ทั้งจอ → ใช้พื้นที่โปร่งใสมุมซ้ายล่างรับแทน */
#hot{position:fixed;z-index:44;left:0;bottom:0;width:300px;height:110px}
#adsToggle{
  position:fixed;z-index:45;left:16px;bottom:16px;
  display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:99px;
  background:rgba(26,26,46,.86);color:#fff;font-weight:700;font-size:15px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s,transform .25s
}
body.ui-on #adsToggle{opacity:1;transform:none;pointer-events:auto}
.sw{width:40px;height:22px;border-radius:99px;background:#5A6072;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
#adsToggle.on .sw{background:var(--deep-mint)}
#adsToggle.on .sw::after{left:21px}

/* ---------- หน้าสร้างลิงก์ (เปิดโดยไม่มี ?event=) ---------- */
#builder{
  position:fixed;inset:0;overflow:auto;background:radial-gradient(120% 70% at 50% -10%,#EAF2FF 0%,var(--bg) 60%);
  padding:48px 16px
}
.b-card{max-width:720px;margin:0 auto;background:#fff;border-radius:24px;padding:32px;box-shadow:0 14px 40px rgba(20,30,60,.10)}
.b-card img{height:56px}
.b-card h1{font-size:26px;font-weight:800;margin-top:14px}
.b-card p{color:var(--slate);margin-top:4px;line-height:1.5}
.b-card label{display:block;font-weight:700;margin-top:22px}
#bInput{width:100%;margin-top:8px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:15px}
#bInput:focus{outline:none;border-color:var(--blue)}
#bErr{color:#D33;margin-top:8px;font-size:14px}
.b-out{margin-top:18px;display:grid;gap:12px}
.b-row{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.b-row b{display:block;margin-bottom:6px}
.b-row code{display:block;font-size:13px;word-break:break-all;color:var(--blue);background:var(--bg);padding:8px 10px;border-radius:8px}
.b-row .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.b-row .acts button,.b-row .acts a{padding:8px 16px;border-radius:99px;font-weight:700;font-size:14px;text-decoration:none}
.b-copy{background:var(--blue);color:#fff}
.b-open{background:var(--bg);color:var(--navy)}
</style>
</head>
<body>

<!-- หน้าสร้างลิงก์ -->
<section id="builder" hidden>
  <div class="b-card">
    <img src="../assets/logo.png" alt="carbonMICE">
    <h1>สร้างลิงก์ Dashboard + วิดีโอโฆษณา</h1>
    <p>วางลิงก์ dashboard ของงาน (เช่น https://carbonmice.pea.co.th/event/…/dashboard?preview=true) แล้วคัดลอกลิงก์ไปเปิดที่หน้างาน</p>
    <label for="bInput">ลิงก์ dashboard ของงาน</label>
    <input id="bInput" type="url" placeholder="https://carbonmice.pea.co.th/event/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx/dashboard?preview=true" autocomplete="off">
    <div id="bErr" hidden>ไม่พบ event id ในลิงก์นี้</div>
    <div class="b-out" id="bOut" hidden>
      <div class="b-row">
        <b>📺 มีวิดีโอโฆษณา</b>
        <code id="bWith"></code>
        <div class="acts"><button class="b-copy" data-copy="bWith">คัดลอก</button><a class="b-open" id="bWithOpen" target="_blank" rel="noopener">เปิดดู ↗</a></div>
      </div>
      <div class="b-row">
        <b>🚫 ไม่มีวิดีโอ (dashboard อย่างเดียว)</b>
        <code id="bWithout"></code>
        <div class="acts"><button class="b-copy" data-copy="bWithout">คัดลอก</button><a class="b-open" id="bWithoutOpen" target="_blank" rel="noopener">เปิดดู ↗</a></div>
      </div>
    </div>
  </div>
</section>

<!-- dashboard -->
<iframe id="dash" hidden allow="fullscreen" title="carbonMICE Dashboard"></iframe>

<button id="fsBtn" hidden><img src="fs-icon.svg" alt=""><span id="fsLabel">ขยายหน้าจอ</span></button>

<div id="backdrop"></div>

<div id="dock" class="land" aria-live="polite">
  <div class="dock-in">
    <div class="dock-head">
      <img src="../assets/logo.png" alt="carbonMICE">
      <span class="tag">GREEN EVENT PLATFORM</span>
      <span class="sp"></span>
      <button class="ctl" id="adSound" title="เปิดเสียง"></button>
      <button class="ctl" id="adExpand" title="ขยาย">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path id="expIcon" d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
      </button>
      <button class="ctl" id="adClose" title="ปิด">✕</button>
    </div>
    <div class="vbox">
      <video id="adVid" muted playsinline preload="auto"></video>
      <div class="vprog"><i id="adProg"></i></div>
    </div>
  </div>
</div>

<div id="hot" hidden></div>
<button id="adsToggle" class="on"><span class="sw"></span><span id="adsLabel">วิดีโอโฆษณา: เปิด</span></button>

<script>
/* ================= ตั้งค่า ================= */
const CONFIG = {
  base: 'https://carbonmice.pea.co.th/event/',
  // ลำดับวน: dashboard อย่างเดียว → แนวนอน → dashboard อย่างเดียว → แนวตั้ง → …
  ads: [
    { src: '../videos/clip1.mp4', shape: 'land' },  // YouTube wZLQ6A69Jtw
    { src: '../videos/clip2.mp4', shape: 'port' },  // Facebook สะกิดต่อมเอ๊ะ (1JTjAnzNjv)
  ],
  gapMs: 5 * 60 * 1000,     // dashboard อย่างเดียวก่อนขึ้นโฆษณาแต่ละรอบ
  uiHideMs: 3000,           // ปุ่มเปิด/ปิดวิดีโอ + เมาส์ ซ่อนเองหลังไม่ขยับ
  cacheName: 'cmice-kiosk-videos-v1',
  storeKey: 'cmdash_ads',
};

const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);
if (qs.get('gap')) CONFIG.gapMs = Math.max(3, +qs.get('gap')) * 1000;   // สำหรับทดสอบ (วินาที)

const UUID = /([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i;
function eventIdFrom(s) { const m = String(s || '').match(UUID); return m ? m[1].toLowerCase() : null; }
const eventId = eventIdFrom(qs.get('event') || qs.get('dash'));

/* ================= หน้าสร้างลิงก์ ================= */
function linkFor(id, ads) {
  const u = new URL(location.href.split('?')[0]);
  u.searchParams.set('event', id);
  if (!ads) u.searchParams.set('ads', '0');
  return u.href;
}
function initBuilder() {
  $('#builder').hidden = false;
  const inp = $('#bInput');
  const render = () => {
    const id = eventIdFrom(inp.value);
    $('#bErr').hidden = !inp.value.trim() || !!id;
    $('#bOut').hidden = !id;
    if (!id) return;
    const a = linkFor(id, true), b = linkFor(id, false);
    $('#bWith').textContent = a; $('#bWithOpen').href = a;
    $('#bWithout').textContent = b; $('#bWithoutOpen').href = b;
  };
  inp.addEventListener('input', render);
  document.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', async () => {
    const text = $('#' + btn.dataset.copy).textContent;
    try { await navigator.clipboard.writeText(text); } catch (e) {
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch (_) {} t.remove();
    }
    const old = btn.textContent; btn.textContent = '✓ คัดลอกแล้ว';
    setTimeout(() => btn.textContent = old, 1500);
  }));
}

/* ================= เต็มจอ (ทั้งหน้า — วิดีโอยังอยู่) ================= */
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function toggleFs() {
  const el = document.documentElement;
  try {
    if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
  } catch (e) {}
}
function syncFs() {
  document.body.classList.toggle('is-fs', isFs());
  $('#fsLabel').textContent = isFs() ? 'ย่อหน้าจอ' : 'ขยายหน้าจอ';
}

/* ================= เตรียมวิดีโอ (เก็บลงเครื่อง กันเน็ตหลุด) ================= */
const srcs = CONFIG.ads.map(a => a.src);
async function prepareVideos() {
  let cache = null;
  try { cache = await caches.open(CONFIG.cacheName); } catch (e) {}
  await Promise.all(CONFIG.ads.map(async (a, i) => {
    try {
      const abs = new URL(a.src, location.href).href;
      let res = cache ? await cache.match(abs) : null;
      if (!res) {
        const net = await fetch(abs);
        if (!net.ok) throw new Error(net.status);
        if (cache) { try { await cache.put(abs, net.clone()); } catch (e) {} }
        res = net;
      }
      srcs[i] = URL.createObjectURL(await res.blob());
    } catch (e) { console.warn('video cache fail', a.src, e); }
  }));
}

/* ================= รอบโฆษณา ================= */
const dock = $('#dock'), vid = $('#adVid');
let adsOn = true, nextIdx = 0, timer = null, showing = false, soundOn = false;
let lastT = -1, stallAt = 0;

function schedule() {
  clearTimeout(timer);
  if (adsOn) timer = setTimeout(showAd, CONFIG.gapMs);
}
function showAd() {
  if (!adsOn) return;
  const i = nextIdx;
  nextIdx = (nextIdx + 1) % CONFIG.ads.length;
  dock.classList.remove('land', 'port');
  dock.classList.add(CONFIG.ads[i].shape);
  vid.src = srcs[i];
  vid.currentTime = 0;
  applySound();
  showing = true; lastT = -1; stallAt = Date.now();
  vid.play().catch(() => { vid.muted = true; soundOn = false; syncSound(); vid.play().catch(() => {}); });
  requestAnimationFrame(() => dock.classList.add('show'));
}
function hideAd() {
  if (!showing) return;
  showing = false;
  setExpanded(false);
  dock.classList.remove('show');
  setTimeout(() => { if (!showing) { vid.pause(); vid.removeAttribute('src'); vid.load(); } }, 500);
  schedule();
}
vid.addEventListener('ended', hideAd);
vid.addEventListener('error', () => { if (showing) hideAd(); });
vid.addEventListener('timeupdate', () => {
  if (vid.duration) $('#adProg').style.width = (vid.currentTime / vid.duration * 100) + '%';
});
setInterval(() => {   // คลิปค้างเกิน 15 วิ → ปิดรอบนี้
  if (!showing) return;
  if (vid.currentTime !== lastT) { lastT = vid.currentTime; stallAt = Date.now(); }
  else if (Date.now() - stallAt > 15000) hideAd();
}, 3000);

function applySound() { vid.muted = !soundOn; syncSound(); }
const ICON_SOUND = {
  on:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6"/></svg>',
};
function syncSound() {
  $('#adSound').innerHTML = soundOn ? ICON_SOUND.on : ICON_SOUND.off;
  $('#adSound').title = soundOn ? 'ปิดเสียง' : 'เปิดเสียง';
}
$('#adSound').addEventListener('click', () => {
  soundOn = !soundOn; applySound();
  if (vid.paused && showing) vid.play().catch(() => {});
});

function setExpanded(on) {
  document.body.classList.toggle('expanded', on);
  $('#expIcon').setAttribute('d', on ? 'M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7' : 'M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7');
  $('#adExpand').title = on ? 'ย่อ' : 'ขยาย';
}
$('#adExpand').addEventListener('click', () => setExpanded(!document.body.classList.contains('expanded')));
$('#backdrop').addEventListener('click', () => setExpanded(false));
$('#adClose').addEventListener('click', hideAd);
document.addEventListener('keydown', e => { if (e.key === 'Escape') setExpanded(false); });

/* ================= เปิด/ปิดวิดีโอ ================= */
function setAds(on, save) {
  adsOn = on;
  $('#adsToggle').classList.toggle('on', on);
  $('#adsLabel').textContent = 'วิดีโอโฆษณา: ' + (on ? 'เปิด' : 'ปิด');
  if (save) { try { localStorage.setItem(CONFIG.storeKey, on ? '1' : '0'); } catch (e) {} }
  if (!on) { clearTimeout(timer); if (showing) { showing = false; setExpanded(false); dock.classList.remove('show'); vid.pause(); } }
  else if (!showing) schedule();
}
$('#adsToggle').addEventListener('click', () => setAds(!adsOn, true));

/* ปุ่มเปิด/ปิดวิดีโอ โผล่เมื่อขยับเมาส์/แตะ (มุมซ้ายล่าง หรือส่วนของหน้าเรา) แล้วซ่อนเอง */
let uiTimer = null;
function pokeUI() {
  document.body.classList.add('ui-on');
  clearTimeout(uiTimer);
  uiTimer = setTimeout(() => document.body.classList.remove('ui-on'), CONFIG.uiHideMs);
}
['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev => document.addEventListener(ev, pokeUI, { passive: true }));

/* กันจอดับ */
async function keepAwake() { try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

/* ================= เริ่ม ================= */
if (!eventId) {
  initBuilder();
} else {
  $('#dash').src = CONFIG.base + eventId + '/dashboard?preview=true';
  $('#dash').hidden = false;
  $('#fsBtn').hidden = false;
  $('#hot').hidden = false;
  $('#fsBtn').addEventListener('click', toggleFs);
  document.addEventListener('fullscreenchange', syncFs);
  document.addEventListener('webkitfullscreenchange', syncFs);

  let stored = null;
  try { stored = localStorage.getItem(CONFIG.storeKey); } catch (e) {}
  const initial = qs.has('ads') ? qs.get('ads') !== '0' : stored !== '0';
  prepareVideos();
  syncSound();
  setAds(initial, false);
  keepAwake();
  pokeUI();
}
</script>
</body>
</html>
